name: Library checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix example
      - run: npx --no-install react-native bundle --platform ios --entry-file index.js --dev false --bundle-output ../build/example.jsbundle --max-workers 2
        working-directory: example
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: swift test
      - run: npm ci --prefix example
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: example
          bundler-cache: true
      - run: bundle exec pod install --project-directory=ios
        working-directory: example
      - run: xcodebuild -workspace ios/NearbyInteractionExample.xcworkspace -scheme NearbyInteractionExample -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: example
