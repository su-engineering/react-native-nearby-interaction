name: Bug report
description: Report a reproducible library or accessory integration bug
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package, React Native/Expo, iOS and Xcode versions; iPhone model; tag model and firmware.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps and profile/transport configuration. Remove private identifiers, tokens and credentials.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include lifecycle states and error codes.
    validations:
      required: true
